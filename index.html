    <script>
        // Aplica el tema y el idioma guardados antes de pintar, para que no parpadee
        try {
            var tema = localStorage.getItem('tema');
            if (tema === 'oscuro' || tema === 'lavanda' || tema === 'rosa') document.documentElement.setAttribute('data-theme', tema);
            if (localStorage.getItem('idioma') === 'en') document.documentElement.lang = 'en';
        } catch (e) {}
    </script>
